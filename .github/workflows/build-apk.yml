name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Déclenchement manuel en 1 clic depuis l'onglet Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Préparer l'environnement
        run: |
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          fi

      - name: Valider le Wrapper Gradle
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew introuvable, génération du wrapper Gradle..."
            gradle wrapper --gradle-version 9.3.1 || true
          fi
          chmod +x gradlew || true

      - name: Compiler l'APK Android (Debug)
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Téléverser l'APK en tant qu'Artéfact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: PodCraft-AI-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
