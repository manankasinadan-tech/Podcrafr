name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Préparer l'environnement et le Keystore
        run: |
          # Préparer le fichier .env
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Préparer le debug.keystore si absent
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Restauration du debug.keystore à partir du base64..."
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

          if [ ! -f "debug.keystore" ]; then
            echo "Génération d'un debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Autoriser l'exécution de gradlew
        run: chmod +x gradlew || true

      - name: Compiler l'APK Android (Debug)
        run: |
          ./gradlew assembleDebug --stacktrace -Dkotlin.compiler.execution.strategy=daemon

      - name: Téléverser l'APK en tant qu'Artéfact téléchargeable
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PodCraft-AI-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
