name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Déclenchement manuel en 1 clic depuis l'onglet Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Préparer l'environnement
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Autoriser l'exécution de gradlew
        run: |
          chmod +x gradlew || true

      - name: Compiler l'APK Android (Debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Téléverser l'APK en tant qu'Artéfact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: PodCraft-AI-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
